<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worldio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #080b12;
            color: #fff;
            height: 100vh;
        }

        button,
        input {
            font-family: inherit;
        }


        /* REGISTRATION ANIMATION */
        .login-screen::before,
        .login-screen::after {
            content: "";
            position: absolute;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: .22;
            pointer-events: none;
            animation: floatGlow 8s ease-in-out infinite alternate;
        }

        .login-screen::before {
            background: #2563eb;
            top: -180px;
            left: -120px;
        }

        .login-screen::after {
            background: #7c3aed;
            right: -120px;
            bottom: -180px;
            animation-delay: -4s;
        }

        .login-box {
            position: relative;
            overflow: hidden;
            animation: loginCardIn .85s cubic-bezier(.16, 1, .3, 1) both;
            backdrop-filter: blur(18px);
        }

        .login-box::before {
            content: "";
            position: absolute;
            inset: -2px;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(120deg, transparent, #3b82f6aa, transparent, #8b5cf6aa, transparent);
            background-size: 250% 250%;
            animation: borderFlow 5s linear infinite;
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .world-logo {
            display: inline-block;
            filter: drop-shadow(0 0 18px #3b82f688);
            animation: globeFloat 3s ease-in-out infinite;
        }

        .login-box h1 {
            animation: textReveal .7s .15s both;
        }

        .login-box p {
            animation: textReveal .7s .25s both;
        }

        .login-box input {
            position: relative;
            transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease, background .25s ease;
            animation: textReveal .7s .35s both;
        }

        .login-box input:focus {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 0 0 4px #3b82f622, 0 8px 30px #2563eb22;
        }

        .login-button {
            position: relative;
            overflow: hidden;
            isolation: isolate;
            transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
            animation: textReveal .7s .45s both;
            box-shadow: 0 10px 35px #2563eb33;
        }

        .login-button::before {
            content: "";
            position: absolute;
            top: 0;
            left: -120%;
            width: 70%;
            height: 100%;
            background: linear-gradient(90deg, transparent, #ffffff55, transparent);
            transform: skewX(-20deg);
            animation: buttonShine 3.2s 1.2s infinite;
            z-index: -1;
        }

        .login-button:hover {
            opacity: 1;
            transform: translateY(-2px);
            filter: brightness(1.08);
            box-shadow: 0 14px 40px #2563eb55;
        }

        .login-button:active {
            transform: translateY(1px) scale(.98);
        }

        .login-screen.exit {
            animation: loginExit .65s cubic-bezier(.65, 0, .35, 1) forwards;
        }

        .login-screen.exit .login-box {
            animation: loginCardOut .55s cubic-bezier(.65, 0, .35, 1) forwards;
        }

        @keyframes loginCardIn {
            from { opacity: 0; transform: translateY(35px) scale(.92) rotateX(8deg); }
            to { opacity: 1; transform: translateY(0) scale(1) rotateX(0); }
        }

        @keyframes loginCardOut {
            to { opacity: 0; transform: translateY(-25px) scale(1.05); }
        }

        @keyframes loginExit {
            to { opacity: 0; transform: scale(1.08); visibility: hidden; }
        }

        @keyframes globeFloat {
            0%, 100% { transform: translateY(0) rotate(-3deg) scale(1); }
            50% { transform: translateY(-9px) rotate(3deg) scale(1.05); }
        }

        @keyframes floatGlow {
            from { transform: translate3d(0, 0, 0) scale(1); }
            to { transform: translate3d(55px, 35px, 0) scale(1.12); }
        }

        @keyframes borderFlow {
            0% { background-position: 0% 50%; }
            100% { background-position: 250% 50%; }
        }

        @keyframes textReveal {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes buttonShine {
            0%, 35% { left: -120%; }
            60%, 100% { left: 150%; }
        }

        .login-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #60a5fa;
            box-shadow: 0 0 12px #60a5fa;
            pointer-events: none;
            animation: particleFloat var(--duration) ease-in-out infinite;
            opacity: .65;
        }

        @keyframes particleFloat {
            0%, 100% { transform: translate(0, 0) scale(.7); opacity: .15; }
            50% { transform: translate(var(--x), var(--y)) scale(1.4); opacity: .85; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
        }

        /* LOGIN */

        .login-screen {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 20%, #2563eb55, transparent 35%),
                radial-gradient(circle at 80% 80%, #7c3aed44, transparent 35%),
                #080b12;

            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .login-box {
            width: 380px;
            max-width: calc(100% - 30px);
            background: #111827;
            border: 1px solid #263044;
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 25px 80px #00000088;
            text-align: center;
        }

        .world-logo {
            font-size: 55px;
            margin-bottom: 10px;
        }

        .login-box h1 {
            margin: 0;
            font-size: 32px;
        }

        .login-box p {
            color: #9ca3af;
            margin: 10px 0 25px;
        }

        .login-box input {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #374151;
            background: #0b1120;
            color: white;
            outline: none;
            font-size: 16px;
        }

        .login-box input:focus {
            border-color: #3b82f6;
        }

        .login-button {
            width: 100%;
            margin-top: 12px;
            padding: 15px;
            border: 0;
            border-radius: 12px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button:hover {
            opacity: .9;
        }

        /* APP */

        .app {
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* SIDEBAR */

        .sidebar {
            width: 300px;
            background: #0d111a;
            border-right: 1px solid #202938;
            display: flex;
            flex-direction: column;
        }

        .sidebar-top {
            padding: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 23px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .brand span {
            font-size: 30px;
        }

        .search {
            width: 100%;
            background: #171e2b;
            border: 1px solid #242e3f;
            color: white;
            padding: 12px 14px;
            border-radius: 12px;
            outline: none;
        }

        .search:focus {
            border-color: #3b82f6;
        }

        .chats-title {
            color: #6b7280;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            margin: 20px 5px 10px;
        }

        .chat-item {
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-item:hover,
        .chat-item.active {
            background: #1d4ed833;
        }

        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .chat-info {
            min-width: 0;
        }

        .chat-name {
            font-weight: bold;
        }

        .chat-preview {
            color: #6b7280;
            font-size: 13px;
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* PROFILE */

        .profile {
            margin-top: auto;
            padding: 15px;
            border-top: 1px solid #202938;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .profile-info {
            flex: 1;
            min-width: 0;
        }

        .profile-name {
            font-weight: bold;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .online {
            color: #22c55e;
            font-size: 12px;
            margin-top: 3px;
        }

        .settings {
            background: transparent;
            border: 0;
            color: #9ca3af;
            font-size: 20px;
            cursor: pointer;
        }

        /* CHAT */

        .chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(circle at 50% 0%, #1e3a8a15, transparent 40%),
                #0b1019;
            min-width: 0;
        }

        .chat-header {
            height: 75px;
            border-bottom: 1px solid #202938;
            display: flex;
            align-items: center;
            padding: 0 25px;
            gap: 12px;
        }

        .header-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .header-name {
            font-weight: bold;
        }

        .header-status {
            font-size: 12px;
            color: #22c55e;
            margin-top: 3px;
        }

        /* MESSAGES */

        .messages {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
        }

        .welcome {
            text-align: center;
            color: #6b7280;
            margin: 30px 0;
        }

        .message-row {
            display: flex;
            margin-bottom: 15px;
        }

        .message-row.me {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 70%;
        }

        .sender {
            color: #9ca3af;
            font-size: 12px;
            margin: 0 0 5px 4px;
        }

        .message-row.me .sender {
            text-align: right;
            margin-right: 4px;
        }

        .message {
            background: #182131;
            border: 1px solid #263044;
            padding: 11px 15px;
            border-radius: 15px;
            word-wrap: break-word;
        }

        .message-row.me .message {
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            border: 0;
            border-bottom-right-radius: 5px;
        }

        .message-row:not(.me) .message {
            border-bottom-left-radius: 5px;
        }

        /* INPUT */

        .input-area {
            padding: 15px 20px 20px;
            display: flex;
            gap: 10px;
        }

        .message-input {
            flex: 1;
            min-width: 0;
            padding: 14px 16px;
            border: 1px solid #263044;
            border-radius: 14px;
            background: #151d2a;
            color: white;
            outline: none;
            font-size: 15px;
        }

        .message-input:focus {
            border-color: #3b82f6;
        }

        .send {
            width: 52px;
            border: 0;
            border-radius: 14px;
            background: #2563eb;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .send:hover {
            background: #1d4ed8;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .sidebar {
                width: 75px;
            }

            .sidebar-top {
                padding: 12px;
            }

            .brand {
                justify-content: center;
            }

            .brand strong,
            .search,
            .chats-title,
            .chat-info,
            .profile-info,
            .settings {
                display: none;
            }

            .chat-item {
                justify-content: center;
                padding: 10px 0;
            }

            .profile {
                justify-content: center;
            }

            .profile .avatar {
                margin: 0;
            }

            .chat-header {
                padding: 0 15px;
            }

            .messages {
                padding: 15px;
            }

            .message-content {
                max-width: 85%;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<!-- LOGIN -->

<div class="login-screen" id="loginScreen">


    <script>
        // Небольшие светящиеся частицы на экране регистрации
        const loginScreen = document.getElementById("loginScreen");

        for (let i = 0; i < 18; i++) {
            const particle = document.createElement("span");
            particle.className = "login-particle";
            particle.style.left = Math.random() * 100 + "%";
            particle.style.top = Math.random() * 100 + "%";
            particle.style.setProperty("--x", (Math.random() * 100 - 50) + "px");
            particle.style.setProperty("--y", (Math.random() * 100 - 50) + "px");
            particle.style.setProperty("--duration", (3 + Math.random() * 5) + "s");
            particle.style.animationDelay = (-Math.random() * 5) + "s";
            loginScreen.appendChild(particle);
        }
    </script>

    <div class="login-box">

        <div class="world-logo">🌎</div>

        <h1 id="authTitle">Worldio</h1>

        <p id="authSubtitle">Твой маленький мир общения</p>

        <input id="nameInput" type="text" maxlength="20" placeholder="Как тебя называть?">
        <input id="emailInput" type="email" autocomplete="email" placeholder="Твоя почта" style="margin-top:10px;">
        <input id="passwordInput" type="password" autocomplete="new-password" placeholder="Пароль" style="margin-top:10px;">
        <input id="confirmPasswordInput" type="password" autocomplete="new-password" placeholder="Повтори пароль" style="margin-top:10px;">

        <div id="authError" style="min-height:20px;color:#f87171;font-size:13px;margin-top:10px;"></div>

        <button class="login-button" id="authButton" onclick="registerUser()">Создать аккаунт</button>
        <button id="authSwitch" onclick="toggleAuthMode()" style="margin-top:14px;background:none;border:0;color:#60a5fa;cursor:pointer;font-size:14px;">Уже есть аккаунт? Войти</button>

    </div>

</div>


<!-- APP -->

<div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="sidebar-top">

            <div class="brand">
                <span>🌎</span>
                <strong>Worldio</strong>
            </div>

            <input
                class="search"
                id="searchInput"
                placeholder="🔍 Поиск..."
                oninput="searchChats()"
            >

            <div class="chats-title">
                Чаты
            </div>

            <div class="chat-item active" id="generalChat">

                <div class="avatar">
                    🌎
                </div>

                <div class="chat-info">

                    <div class="chat-name">
                        Общий чат
                    </div>

                    <div class="chat-preview" id="preview">
                        Добро пожаловать!
                    </div>

                </div>

            </div>

        </div>


        <!-- PROFILE -->

        <div class="profile">

            <div class="avatar" id="profileAvatar">
                ?
            </div>

            <div class="profile-info">

                <div class="profile-name" id="profileName">
                    Пользователь
                </div>

                <div class="online">
                    ● онлайн
                </div>

            </div>

            <button
                class="settings"
                onclick="changeName()"
                title="Изменить имя"
            >
                ⚙️
            </button>

        </div>

    </aside>


    <!-- CHAT -->

    <main class="chat">

        <header class="chat-header">

            <div class="header-avatar">
                🌎
            </div>

            <div>

                <div class="header-name">
                    Общий чат
                </div>

                <div class="header-status">
                    ● онлайн
                </div>

            </div>

        </header>


        <!-- MESSAGES -->

        <div class="messages" id="messages">

            <div class="welcome">
                🌎 Добро пожаловать в Worldio!
            </div>

        </div>


        <!-- INPUT -->

        <div class="input-area">

            <input
                class="message-input"
                id="messageInput"
                type="text"
                maxlength="500"
                placeholder="Напиши сообщение..."
                autocomplete="off"
            >

            <button
                class="send"
                onclick="sendMessage()"
                title="Отправить"
            >
                ➤
            </button>

        </div>

    </main>

</div>


<script>

    let username = localStorage.getItem("worldio_username");

    // =============================
    // WORLDIO AUTH — SUPABASE
    // =============================

    // Вставь сюда данные своего Supabase проекта.
    const SUPABASE_URL = "https://nzmfysolycxgiooagnma.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_YIvaPxr-dafosdzrcOSMPQ_5xQlRRe3";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );

    let authMode = "register";

    function showAuthError(message) {
        document.getElementById("authError").textContent = message || "";
    }

    function toggleAuthMode() {
        authMode = authMode === "register" ? "login" : "register";
        const isRegister = authMode === "register";
        document.getElementById("authTitle").textContent = isRegister ? "Worldio" : "С возвращением!";
        document.getElementById("authSubtitle").textContent = isRegister ? "Твой маленький мир общения" : "Войди в свой мир общения";
        document.getElementById("nameInput").style.display = isRegister ? "block" : "none";
        document.getElementById("confirmPasswordInput").style.display = isRegister ? "block" : "none";
        document.getElementById("authButton").textContent = isRegister ? "Создать аккаунт" : "Войти";
        document.getElementById("authSwitch").textContent = isRegister ? "Уже есть аккаунт? Войти" : "Нет аккаунта? Зарегистрироваться";
        document.getElementById("passwordInput").autocomplete = isRegister ? "new-password" : "current-password";
        showAuthError("");
    }

    async function registerUser() {
        const name = document.getElementById("nameInput").value.trim().substring(0, 20);
        const email = document.getElementById("emailInput").value.trim();
        const password = document.getElementById("passwordInput").value;
        const confirm = document.getElementById("confirmPasswordInput").value;
        const button = document.getElementById("authButton");

        if (!supabaseClient) return showAuthError("Сначала подключи Supabase в коде Worldio.");
        if (!email) return showAuthError("Введите email.");
        if (password.length < 8) return showAuthError("Пароль должен быть минимум 8 символов.");
        if (authMode === "register" && !name) return showAuthError("Введите имя.");
        if (authMode === "register" && password !== confirm) return showAuthError("Пароли не совпадают.");

        button.disabled = true;
        button.textContent = authMode === "register" ? "Создаём аккаунт..." : "Входим...";
        showAuthError("");

        try {
            if (authMode === "register") {
                const { data, error } = await supabaseClient.auth.signUp({
                    email, password,
                    options: { data: { username: name }, emailRedirectTo: window.location.href }
                });
                if (error) throw error;
                if (data.session) {
                    username = name;
                    localStorage.setItem("worldio_username", username);
                    document.getElementById("loginScreen").classList.add("exit");
                    setTimeout(loadUser, 600);
                } else {
                    showAuthError("Аккаунт создан! Проверь почту и подтверди email.");
                }
            } else {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) throw error;
                username = data.user.user_metadata?.username || data.user.email.split("@")[0];
                localStorage.setItem("worldio_username", username);
                document.getElementById("loginScreen").classList.add("exit");
                setTimeout(loadUser, 600);
            }
        } catch (error) {
            showAuthError(error.message || "Не удалось выполнить операцию.");
        } finally {
            button.disabled = false;
            button.textContent = authMode === "register" ? "Создать аккаунт" : "Войти";
        }
    }

    function enterWorld() { registerUser(); }

    function loadUser() {

        document.getElementById("loginScreen").style.display = "none";

        const profileName = document.getElementById("profileName");
        const profileAvatar = document.getElementById("profileAvatar");

        profileName.textContent = username;
        profileAvatar.textContent = username.charAt(0).toUpperCase();

        profileAvatar.animate(
            [
                { transform: "scale(0) rotate(-180deg)", opacity: 0 },
                { transform: "scale(1.15) rotate(10deg)", opacity: 1 },
                { transform: "scale(1) rotate(0)", opacity: 1 }
            ],
            { duration: 650, easing: "cubic-bezier(.16,1,.3,1)" }
        );
    }


    function changeName() {

        const newName = prompt(
            "Как тебя теперь называть?",
            username
        );

        if (!newName) {
            return;
        }

        const cleanName = newName.trim();

        if (cleanName === "") {
            return;
        }

        username = cleanName.substring(0, 20);

        localStorage.setItem(
            "worldio_username",
            username
        );

        loadUser();

    }


    function sendMessage() {

        const input =
            document.getElementById("messageInput");

        const messages =
            document.getElementById("messages");

        const text = input.value.trim();

        if (text === "") {
            return;
        }


        const row =
            document.createElement("div");

        row.className = "message-row me";


        const content =
            document.createElement("div");

        content.className = "message-content";


        const sender =
            document.createElement("div");

        sender.className = "sender";

        sender.textContent = username;


        const message =
            document.createElement("div");

        message.className = "message";

        message.textContent = text;


        content.appendChild(sender);

        content.appendChild(message);

        row.appendChild(content);

        messages.appendChild(row);


        input.value = "";

        messages.scrollTop =
            messages.scrollHeight;


        document.getElementById("preview").textContent =
            text;

    }


    function searchChats() {

        const search =
            document
                .getElementById("searchInput")
                .value
                .toLowerCase();

        const chat =
            document.getElementById("generalChat");

        if ("общий чат".includes(search)) {
            chat.style.display = "flex";
        } else {
            chat.style.display = "none";
        }

    }


    document
        .getElementById("messageInput")
        .addEventListener("keydown", function(event) {

            if (event.key === "Enter") {
                sendMessage();
            }

        });


    document
        .getElementById("nameInput")
        .addEventListener("keydown", function(event) {

            if (event.key === "Enter") {
                enterWorld();
            }

        });


    async function restoreSession() {
        if (!supabaseClient) return;
        const { data } = await supabaseClient.auth.getSession();
        const user = data.session?.user;
        if (!user) return;
        username = user.user_metadata?.username || user.email.split("@")[0];
        localStorage.setItem("worldio_username", username);
        loadUser();
    }

    restoreSession();

</script>
