<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worldio</title>
<meta name="theme-color" content="#0b0e14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Worldio">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
/* ============================= DESIGN TOKENS ============================= */
:root{
  --bg:#0b0e14;
  --bg-panel:#10141c;
  --bg-elevated:#161b25;
  --bg-hover:#1b2130;
  --border:#232a38;
  --text:#eef1f6;
  --text-dim:#909aab;
  --text-faint:#5b6472;
  --accent:#2563eb;
  --accent-hover:#3b74f0;
  --danger:#e5484d;
  --danger-bg:#2a1418;
  --success:#22c55e;
  --radius-sm:8px;
  --radius:12px;
  --radius-lg:18px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden}
input,textarea,button{font-family:inherit}
button{cursor:pointer}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#242b3a;border-radius:20px}
::-webkit-scrollbar-track{background:transparent}

.field{
  width:100%;background:var(--bg-elevated);border:1px solid var(--border);color:var(--text);
  border-radius:var(--radius-sm);padding:11px 13px;outline:none;font-size:14px;transition:border-color .15s;
}
.field:focus{border-color:var(--accent)}
textarea.field{resize:vertical}

.btn-primary{
  width:100%;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);
  padding:12px;font-weight:600;font-size:14px;transition:background .15s;
}
.btn-primary:hover{background:var(--accent-hover)}
.btn-primary:disabled{opacity:.5;cursor:default}
.btn-danger{
  width:100%;background:var(--danger-bg);color:var(--danger);border:1px solid #4a2028;
  border-radius:var(--radius-sm);padding:11px;font-weight:600;font-size:13px;margin-top:8px;
}
.btn-danger:hover{background:#331a1e}

.icon-btn{
  width:38px;height:38px;border-radius:var(--radius-sm);border:1px solid var(--border);
  background:var(--bg-elevated);color:var(--text-dim);display:grid;place-items:center;font-size:16px;
}
.icon-btn:hover{color:var(--text);border-color:#37455e}
.icon-btn.small{width:30px;height:30px;font-size:15px}

.status-text{font-size:12px;color:var(--text-dim);min-height:16px;text-align:center;margin-top:6px}

.avatar{
  width:42px;height:42px;border-radius:var(--radius-sm);display:grid;place-items:center;
  font-size:19px;color:#fff;background:var(--accent);flex:0 0 auto;overflow:hidden;
}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.lg{width:84px;height:84px;font-size:36px;border-radius:22px}
.avatar.sm{width:32px;height:32px;font-size:15px;border-radius:9px}

/* ============================= AUTH SCREEN ============================= */
.auth-screen{
  height:100%;display:flex;align-items:center;justify-content:center;padding:20px;
}
.auth-card{
  width:100%;max-width:380px;background:var(--bg-panel);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:32px 28px;
}
.auth-logo{width:52px;height:52px;border-radius:16px;background:var(--accent);display:grid;place-items:center;font-size:26px;margin:0 auto 16px}
.auth-card h1{text-align:center;margin:0 0 4px;font-size:22px}
.auth-card > p{text-align:center;color:var(--text-dim);margin:0 0 22px;font-size:13px}
.auth-tabs{display:flex;background:var(--bg-elevated);border-radius:var(--radius-sm);padding:4px;margin-bottom:18px}
.auth-tab{flex:1;background:none;border:none;color:var(--text-dim);padding:9px;border-radius:6px;font-size:13px;font-weight:600}
.auth-tab.active{background:var(--accent);color:#fff}
.auth-card .field{margin-bottom:10px}

/* ============================= APP SHELL ============================= */
.app-shell{display:flex;height:100%}
.sidebar{
  width:300px;flex:0 0 auto;background:var(--bg-panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;
}
.sidebar-top{display:flex;align-items:center;justify-content:space-between;padding:16px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px}
.brand span{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;font-size:15px}
.search-trigger{
  margin:0 16px 12px;text-align:left;background:var(--bg-elevated);border:1px solid var(--border);
  color:var(--text-dim);border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;
}
.search-trigger:hover{color:var(--text)}
.sidebar-section-head{display:flex;align-items:center;justify-content:space-between;padding:0 16px 8px;color:var(--text-faint);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.chat-list{flex:1;overflow-y:auto;padding:0 8px 12px}
.chat-item{
  display:flex;align-items:center;gap:11px;padding:9px 8px;border-radius:var(--radius-sm);cursor:pointer;
}
.chat-item:hover{background:var(--bg-hover)}
.chat-item.active{background:var(--bg-elevated);border:1px solid var(--border)}
.chat-item-info{flex:1;min-width:0}
.chat-item-top{display:flex;justify-content:space-between;gap:6px}
.chat-item-name{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-item-time{font-size:10.5px;color:var(--text-faint);flex:0 0 auto}
.chat-item-preview{font-size:12px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.chat-list-empty{padding:30px 20px;text-align:center;color:var(--text-dim);font-size:13px}

.main-panel{flex:1;display:flex;flex-direction:column;min-width:0}
.chat-header{
  height:64px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;border-bottom:1px solid var(--border);
}
.chat-header-info{display:flex;align-items:center;gap:12px}
.chat-header-name{font-weight:700;font-size:14.5px}
.chat-header-status{font-size:12px;color:var(--text-dim)}

.messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.messages-empty{
  height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--text-dim);gap:10px;text-align:center;
}
.messages-empty .avatar.lg{margin-bottom:6px}
.messages-empty h2{margin:0;font-size:18px;color:var(--text)}
.messages-empty p{margin:0;font-size:13px;max-width:320px}
.empty-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;justify-content:center}
.empty-actions button{
  background:var(--bg-elevated);border:1px solid var(--border);color:var(--text);
  border-radius:var(--radius-sm);padding:9px 14px;font-size:13px;
}
.empty-actions button:hover{border-color:#37455e}

.msg-row{display:flex;gap:9px;max-width:70%}
.msg-row.me{align-self:flex-end;flex-direction:row-reverse}
.msg-bubble{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);padding:9px 12px}
.msg-row.me .msg-bubble{background:var(--accent);border-color:var(--accent)}
.msg-sender{font-size:11.5px;font-weight:700;margin-bottom:3px;color:var(--text-dim)}
.msg-row.me .msg-sender{display:none}
.msg-text{font-size:14px;line-height:1.4;white-space:pre-wrap;word-break:break-word}
.msg-time{font-size:10px;color:var(--text-faint);margin-top:4px}
.msg-row.me .msg-time{color:#c7d7fd}
.msg-row.pending{opacity:.55}
.msg-row.failed .msg-bubble{border-color:var(--danger)}

.composer{display:flex;gap:10px;padding:16px 20px;border-top:1px solid var(--border);flex:0 0 auto}
.composer .field{border-radius:var(--radius)}
.btn-send{
  width:44px;height:44px;flex:0 0 auto;border-radius:var(--radius);border:none;
  background:var(--accent);color:#fff;font-size:16px;display:grid;place-items:center;
}
.btn-send:disabled{opacity:.4}
.btn-send:hover:not(:disabled){background:var(--accent-hover)}

/* ============================= MODALS ============================= */
.modal-overlay{
  position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;
  z-index:50;padding:16px;
}
.modal{
  width:100%;max-width:440px;max-height:88vh;overflow-y:auto;background:var(--bg-panel);
  border:1px solid var(--border);border-radius:var(--radius-lg);
}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border)}
.modal-head h2{margin:0;font-size:16px}
.modal-body{padding:20px;display:flex;flex-direction:column;gap:12px}
.section-title{font-size:11px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}

.profile-banner{height:110px;border-radius:var(--radius);background:var(--accent);background-size:cover;background-position:center}
.profile-avatar-row{display:flex;align-items:center;gap:16px;margin-top:-40px;padding-left:12px}
.avatar-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;flex:1}
.avatar-grid button{
  aspect-ratio:1;border-radius:8px;border:1px solid var(--border);background:var(--bg-elevated);
  font-size:16px;display:grid;place-items:center;
}
.avatar-grid button.selected{border-color:var(--accent);background:#16233f}
.color-grid{display:flex;gap:8px;flex-wrap:wrap}
.color-swatch{width:28px;height:28px;border-radius:9px;border:2px solid transparent}
.color-swatch.selected{border-color:#fff}
.upload-btn{
  display:block;text-align:center;background:var(--bg-elevated);border:1px dashed var(--border);
  border-radius:var(--radius-sm);padding:10px;font-size:13px;color:var(--text-dim);
}
.upload-btn:hover{color:var(--text)}
.collectible-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.collectible-card{
  background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:10px 8px;text-align:center;font-size:11px;color:var(--text-dim);
}
.collectible-card .emoji{font-size:22px;display:block;margin-bottom:4px}
.collectible-card.equipped{border-color:var(--accent);color:var(--text)}

.search-results{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto}
.search-result{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--radius-sm)}
.search-result:hover{background:var(--bg-hover)}
.search-result-name{flex:1;font-size:13.5px;font-weight:600}
.search-result button{
  background:var(--accent);color:#fff;border:none;border-radius:7px;padding:6px 11px;font-size:12px;
}
.search-empty{color:var(--text-dim);font-size:12.5px;text-align:center;padding:16px 0}

.tabs{display:flex;background:var(--bg-elevated);border-radius:var(--radius-sm);padding:4px}
.tab{flex:1;background:none;border:none;color:var(--text-dim);padding:8px;border-radius:6px;font-size:13px;font-weight:600}
.tab.active{background:var(--accent);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:6px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:999px;padding:5px 10px;font-size:12px}
.chip button{background:none;border:none;color:var(--text-faint);font-size:13px}

[hidden]{display:none!important}
</style>
</head>
<body>

<!-- ============================= AUTH SCREEN ============================= -->
<div id="authScreen" class="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">🌐</div>
    <h1>Worldio</h1>
    <p>Войди или создай аккаунт, чтобы начать</p>
    <div class="auth-tabs">
      <button class="auth-tab active" data-mode="login">Вход</button>
      <button class="auth-tab" data-mode="register">Регистрация</button>
    </div>
    <input id="regUsername" class="field" placeholder="Имя пользователя" hidden>
    <input id="authEmail" class="field" type="email" placeholder="Email" autocomplete="username">
    <input id="authPassword" class="field" type="password" placeholder="Пароль" autocomplete="current-password">
    <button id="authSubmit" class="btn-primary">Войти</button>
    <div id="authStatus" class="status-text"></div>
  </div>
</div>

<!-- ============================= APP SHELL ============================= -->
<div id="appShell" class="app-shell" hidden>
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="brand"><span>🌐</span>Worldio</div>
      <button id="btnOpenProfile" class="icon-btn" title="Профиль">👤</button>
    </div>
    <button id="btnSearch" class="search-trigger">🔍 Найти человека</button>
    <div class="sidebar-section-head">
      <span>Чаты</span>
      <button id="btnCreateChat" class="icon-btn small" title="Создать группу/канал">+</button>
    </div>
    <div id="chatList" class="chat-list"></div>
  </aside>

  <main class="main-panel">
    <header id="chatHeader" class="chat-header">
      <div class="chat-header-info">
        <div id="headerAvatar" class="avatar">💬</div>
        <div>
          <div id="headerName" class="chat-header-name">Выбери чат</div>
          <div id="headerStatus" class="chat-header-status"></div>
        </div>
      </div>
      <button id="btnAddMember" class="icon-btn" title="Добавить участника" hidden>➕</button>
    </header>
    <div id="messages" class="messages"></div>
    <footer class="composer">
      <input id="messageInput" class="field" placeholder="Сначала выбери чат..." disabled>
      <button id="btnSend" class="btn-send" disabled>➤</button>
    </footer>
  </main>
</div>

<!-- ============================= MODAL: PROFILE ============================= -->
<div id="profileModal" class="modal-overlay" hidden>
  <div class="modal">
    <div class="modal-head"><h2>Профиль</h2><button class="icon-btn" data-close>✕</button></div>
    <div class="modal-body">
      <div id="profileBanner" class="profile-banner"></div>
      <div class="profile-avatar-row">
        <div id="profileAvatarPreview" class="avatar lg">🌎</div>
      </div>
      <div class="section-title">Аватар</div>
      <div id="avatarEmojiGrid" class="avatar-grid"></div>
      <div class="section-title">Цвет</div>
      <div id="avatarColorGrid" class="color-grid"></div>
      <div class="section-title">Баннер</div>
      <div class="color-grid" id="bannerColorGrid"></div>
      <label class="upload-btn">🖼 Загрузить изображение баннера<input type="file" id="bannerInput" accept="image/*" hidden></label>
      <input id="profileUsername" class="field" placeholder="Имя пользователя">
      <textarea id="profileBio" class="field" rows="2" placeholder="О себе"></textarea>
      <div class="section-title">Коллекция</div>
      <div id="collectibleGrid" class="collectible-grid"></div>
      <button id="btnSaveProfile" class="btn-primary">Сохранить</button>
      <div id="profileStatus" class="status-text"></div>
      <button id="btnLogout" class="btn-danger">Выйти из аккаунта</button>
    </div>
  </div>
</div>

<!-- ============================= MODAL: SEARCH ============================= -->
<div id="searchModal" class="modal-overlay" hidden>
  <div class="modal">
    <div class="modal-head"><h2>Найти человека</h2><button class="icon-btn" data-close>✕</button></div>
    <div class="modal-body">
      <input id="searchInput" class="field" placeholder="Введи имя пользователя">
      <div id="searchResults" class="search-results"></div>
    </div>
  </div>
</div>

<!-- ============================= MODAL: CREATE CHAT ============================= -->
<div id="createModal" class="modal-overlay" hidden>
  <div class="modal">
    <div class="modal-head"><h2>Новый чат</h2><button class="icon-btn" data-close>✕</button></div>
    <div class="modal-body">
      <div class="tabs" id="createTabs">
        <button class="tab active" data-type="group">Группа</button>
        <button class="tab" data-type="channel">Канал</button>
      </div>
      <input id="createName" class="field" placeholder="Название">
      <textarea id="createDescription" class="field" rows="2" placeholder="Описание (необязательно)"></textarea>
      <div class="section-title">Участники</div>
      <input id="createMemberSearch" class="field" placeholder="Поиск по имени">
      <div id="createMemberResults" class="search-results"></div>
      <div id="createMemberChips" class="chips"></div>
      <button id="btnCreateSubmit" class="btn-primary">Создать</button>
      <div id="createStatus" class="status-text"></div>
    </div>
  </div>
</div>

<!-- ============================= MODAL: ADD MEMBER ============================= -->
<div id="addMemberModal" class="modal-overlay" hidden>
  <div class="modal">
    <div class="modal-head"><h2>Добавить участника</h2><button class="icon-btn" data-close>✕</button></div>
    <div class="modal-body">
      <input id="addMemberSearch" class="field" placeholder="Поиск по имени">
      <div id="addMemberResults" class="search-results"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";

/* ============================================================================
   CONFIG
   ============================================================================ */
const Config = {
  supabaseUrl: "https://nzmfysolycxgiooagnma.supabase.co",
  supabaseAnonKey: "sb_publishable_YIvaPxr-dafosdzrcOSMPQ_5xQlRRe3",
  avatarEmojis: ["🌎","😀","😎","🤖","👾","🐱","🐶","🦊","🐼","🦁","🐸","🐵","🌙","⭐","🔥","⚡","💎","🎮","🎧","🎨","🚀","🌈","🍀","👑"],
  avatarColors: ["#2563eb","#0891b2","#059669","#d97706","#dc2626","#7c3aed","#475569","#111827"],
  bannerColors: ["#2563eb","#0891b2","#059669","#7c3aed","#334155","#111827"],
  collectibles: [
    {id:"crown", name:"Noir Crown", emoji:"👑"},
    {id:"ghoul", name:"Ghoul Visor", emoji:"👻"},
    {id:"halo", name:"Void Halo", emoji:"😇"},
    {id:"ring", name:"Black Ring", emoji:"💍"},
    {id:"wings", name:"Noir Wings", emoji:"🦋"},
    {id:"sigil", name:"Silver Sigil", emoji:"🔮"}
  ]
};

const supabase = window.supabase.createClient(Config.supabaseUrl, Config.supabaseAnonKey);

/* ============================================================================
   STATE
   ============================================================================ */
const State = {
  userId: null,
  profile: null,
  chats: new Map(),
  membersByChat: new Map(),
  messagesByChat: {},
  currentChatId: null,
  realtimeChannel: null,
  pendingSends: new Set()
};

/* ============================================================================
   UTIL
   ============================================================================ */
const $ = (id) => document.getElementById(id);
const el = (tag, cls) => { const n = document.createElement(tag); if (cls) n.className = cls; return n; };
const esc = (v) => String(v ?? "");
const formatTime = (iso) => iso ? new Date(iso).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"}) : "";

function renderAvatarInto(node, avatar, color) {
  node.innerHTML = "";
  if (avatar && String(avatar).startsWith("data:image")) {
    const img = document.createElement("img");
    img.src = avatar;
    node.appendChild(img);
    node.style.background = "#1b2130";
  } else {
    node.textContent = avatar || "🌎";
    node.style.background = color || Config.avatarColors[0];
  }
}

function showModal(id) { $(id).hidden = false; }
function hideModal(id) { $(id).hidden = true; }
document.querySelectorAll("[data-close]").forEach(btn => {
  btn.addEventListener("click", () => btn.closest(".modal-overlay").hidden = true);
});
document.querySelectorAll(".modal-overlay").forEach(overlay => {
  overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.hidden = true; });
});

/* ============================================================================
   AUTH
   ============================================================================ */
const Auth = {
  mode: "login",

  init() {
    document.querySelectorAll(".auth-tab").forEach(tab => {
      tab.addEventListener("click", () => {
        Auth.mode = tab.dataset.mode;
        document.querySelectorAll(".auth-tab").forEach(t => t.classList.toggle("active", t === tab));
        $("regUsername").hidden = Auth.mode !== "register";
        $("authSubmit").textContent = Auth.mode === "register" ? "Создать аккаунт" : "Войти";
        $("authStatus").textContent = "";
      });
    });
    $("authSubmit").addEventListener("click", Auth.submit);
    [$("authEmail"), $("authPassword"), $("regUsername")].forEach(input => {
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") Auth.submit(); });
    });

    supabase.auth.onAuthStateChange((event, session) => {
      if (session?.user) App.start(session.user);
      else App.stop();
    });
    supabase.auth.getSession().then(({ data }) => {
      if (data.session?.user) App.start(data.session.user);
    });
  },

  async submit() {
    const email = $("authEmail").value.trim();
    const password = $("authPassword").value;
    const status = $("authStatus");
    if (!email || !password) { status.textContent = "Заполни email и пароль"; return; }

    $("authSubmit").disabled = true;
    status.textContent = "Подождите...";
    try {
      if (Auth.mode === "register") {
        const username = $("regUsername").value.trim();
        if (!username) { status.textContent = "Придумай имя пользователя"; return; }
        const { data, error } = await supabase.auth.signUp({ email, password });
        if (error) throw error;
        if (data.user) {
          await supabase.from("profiles").upsert({
            id: data.user.id, username, avatar: "🌎", avatar_color: Config.avatarColors[0]
          }, { onConflict: "id" });
        }

/* ============================================================================
   CHATS
   ============================================================================ */
const Chats = {
  async loadAll() {
    const { data: memberships, error: mErr } = await supabase
      .from("chat_members").select("chat_id").eq("user_id", State.userId);
    if (mErr) { console.error(mErr); return; }
    const chatIds = (memberships || []).map(m => m.chat_id);
    State.chats.clear();
    if (!chatIds.length) { UI.renderChatList(); UI.renderMessages(); Realtime.subscribe(); return; }

    const { data: chats, error } = await supabase
      .from("chats").select("id,name,type,owner_id,avatar,avatar_color,description,created_at")
      .in("id", chatIds);
    if (error) { console.error(error); return; }

    const { data: lastMsgs } = await supabase
      .from("messages").select("chat_id,content,created_at")
      .in("chat_id", chatIds).order("created_at", { ascending: false }).limit(300);
    const lastByChat = new Map();
    for (const m of lastMsgs || []) if (!lastByChat.has(m.chat_id)) lastByChat.set(m.chat_id, m);

    for (const chat of chats || []) {
      const enriched = { ...chat };
      if (chat.type === "direct") {
        const { data: members } = await supabase.from("chat_members").select("user_id").eq("chat_id", chat.id);
        const peerId = (members || []).map(m => m.user_id).find(id => id !== State.userId);
        if (peerId) {
          const peer = await Profiles.get(peerId);
          enriched.peerId = peerId;
          enriched.displayName = peer?.username || "Пользователь";
          enriched.avatar = peer?.avatar || "👤";
          enriched.avatar_color = peer?.avatar_color || Config.avatarColors[0];
        }
      } else {
        enriched.displayName = chat.name || (chat.type === "channel" ? "Канал" : "Группа");
      }
      const last = lastByChat.get(chat.id);
      enriched.lastMessage = last?.content || "";
      enriched.lastMessageAt = last?.created_at || chat.created_at;
      State.chats.set(chat.id, enriched);
    }

    UI.renderChatList();
    if (!State.currentChatId || !State.chats.has(State.currentChatId)) {
      const first = [...State.chats.values()][0];
      if (first) await Chats.select(first.id);
    }
    Realtime.subscribe();
  },

  async select(chatId) {
    const chat = State.chats.get(chatId);
    if (!chat) return;
    State.currentChatId = chatId;
    UI.renderChatList();
    UI.renderHeader(chat);
    if (!State.messagesByChat[chatId]) await Messages.load(chatId);
    UI.renderMessages();
  },

  async findOrCreateDirect(peerId) {
    const { data: mine } = await supabase.from("chat_members").select("chat_id").eq("user_id", State.userId);
    const myChatIds = (mine || []).map(m => m.chat_id);
    if (myChatIds.length) {
      const { data: shared } = await supabase.from("chat_members").select("chat_id").eq("user_id", peerId).in("chat_id", myChatIds);
      for (const row of shared || []) {
        const { data: chat } = await supabase.from("chats").select("id,type").eq("id", row.chat_id).maybeSingle();
        if (chat?.type === "direct") return chat.id;
      }
    }
    const { data: chat, error } = await supabase.from("chats").insert({ type: "direct", owner_id: State.userId }).select("id").single();
    if (error) throw error;
    await supabase.from("chat_members").insert([
      { chat_id: chat.id, user_id: State.userId },
      { chat_id: chat.id, user_id: peerId }
    ]);
    return chat.id;
  },

  async create(type, name, description, memberIds) {
    const { data: chat, error } = await supabase.from("chats")
      .insert({ type, name, description: description || null, owner_id: State.userId })
      .select("id").single();
    if (error) throw error;
    const rows = [{ chat_id: chat.id, user_id: State.userId }, ...memberIds.map(id => ({ chat_id: chat.id, user_id: id }))];
    await supabase.from("chat_members").insert(rows);
    return chat.id;
  },

  async addMember(chatId, userId) {
    await supabase.from("chat_members").insert({ chat_id: chatId, user_id: userId });
  },

  updatePreview(chatId, text, iso) {
    const chat = State.chats.get(chatId);
    if (!chat) return;
    chat.lastMessage = text;
    chat.lastMessageAt = iso || new Date().toISOString();
    UI.renderChatList();
  }
};

/* ============================================================================
   MESSAGES
   ============================================================================ */
const Messages = {
  async load(chatId) {
    const { data, error } = await supabase
      .from("messages").select("id,chat_id,user_id,content,created_at,profiles(username,avatar,avatar_color)")
      .eq("chat_id", chatId).order("created_at", { ascending: true });
    if (error) { console.error(error); State.messagesByChat[chatId] = []; return; }
    State.messagesByChat[chatId] = data || [];
  },

  addOptimistic(chatId, text) {
    if (!State.messagesByChat[chatId]) State.messagesByChat[chatId] = [];
    const localId = "local-" + Date.now() + "-" + Math.random().toString(36).slice(2, 7);
    const item = {
      id: localId, chat_id: chatId, user_id: State.userId, content: text,
      created_at: new Date().toISOString(),
      profiles: { username: State.profile?.username || "Вы", avatar: State.profile?.avatar, avatar_color: State.profile?.avatar_color },
      __pending: true
    };
    State.messagesByChat[chatId].push(item);
    return item;
  },

  replace(chatId, localId, serverRow) {
    const list = State.messagesByChat[chatId] || [];
    const idx = list.findIndex(m => m.id === localId);
    if (idx >= 0) list[idx] = serverRow;
  },

  markFailed(chatId, localId) {
    const item = (State.messagesByChat[chatId] || []).find(m => m.id === localId);
    if (item) { item.__pending = false; item.__failed = true; }
  },

  async send() {
    const input = $("messageInput");
    const chatId = State.currentChatId;
    const text = input.value.trim();
    if (!text || !chatId) return;
    input.value = "";
    input.focus();

    const optimistic = Messages.addOptimistic(chatId, text);
    State.pendingSends.add(optimistic.id);
    UI.renderMessages();

    try {
      const { data, error } = await supabase.from("messages")
        .insert({ chat_id: chatId, user_id: State.userId, content: text })
        .select("id,chat_id,user_id,content,created_at,profiles(username,avatar,avatar_color)")
        .single();
      if (error) throw error;
      Messages.replace(chatId, optimistic.id, data);
      Chats.updatePreview(chatId, text, data.created_at);
    } catch (err) {
      console.error("send:", err);
      Messages.markFailed(chatId, optimistic.id);
    } finally {
      State.pendingSends.delete(optimistic.id);
      if (State.currentChatId === chatId) UI.renderMessages();
    }
  }
};

/* ============================================================================
   REALTIME
   ============================================================================ */
const Realtime = {
  subscribe() {
    if (State.realtimeChannel) supabase.removeChannel(State.realtimeChannel);
    State.realtimeChannel = supabase.channel("worldio-messages")
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" }, async (payload) => {
        const row = payload.new;
        if (!State.chats.has(row.chat_id)) return;
        if (!State.messagesByChat[row.chat_id]) State.messagesByChat[row.chat_id] = [];
        const list = State.messagesByChat[row.chat_id];
        if (list.some(m => m.id === row.id)) return;

        const isMine = row.user_id === State.userId;
        const entry = { ...row, profiles: isMine ? { username: State.profile?.username, avatar: State.profile?.avatar, avatar_color: State.profile?.avatar_color } : null };
        list.push(entry);
        if (row.chat_id === State.currentChatId) UI.renderMessages();
        Chats.updatePreview(row.chat_id, row.content, row.created_at);

        if (!isMine) {
          const profile = await Profiles.get(row.user_id);
          if (profile) {
            entry.profiles = profile;
            if (row.chat_id === State.currentChatId) UI.renderMessages();
          }
        }
      })
      .subscribe();
  }
};

const Search = {
  async users(query) {
    if (!query.trim()) return [];
    const { data, error } = await supabase
      .from("profiles").select("id,username,avatar,avatar_color")
      .ilike("username", `%${query.trim()}%`).neq("id", State.userId).limit(15);
    if (error) { console.error(error); return []; }
    return data || [];
  }
};

function hexToRgbStr(hex) {
  // normalises so comparisons with computed inline styles work across browsers
  const probe = document.createElement("div");
  probe.style.background = hex;
  document.body.appendChild(probe);
  const computed = getComputedStyle(probe).backgroundColor;
  document.body.removeChild(probe);
  return computed;
}

function resizeImageToDataUrl(file, maxW, maxH, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = () => { img.src = reader.result; };
    reader.onerror = reject;
    img.onload = () => {
      let { width, height } = img;
      const ratio = Math.min(maxW / width, maxH / height, 1);
      width = Math.round(width * ratio); height = Math.round(height * ratio);
      const canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      canvas.getContext("2d").drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

const CreateChat = {
  type: "group",
  members: new Map(),
  timer: null,

  init() {
    $("btnCreateChat").addEventListener("click", CreateChat.open);
    document.querySelectorAll("#createTabs .tab").forEach(tab => {
      tab.addEventListener("click", () => {
        CreateChat.type = tab.dataset.type;
        document.querySelectorAll("#createTabs .tab").forEach(t => t.classList.toggle("active", t === tab));
        $("createDescription").placeholder = CreateChat.type === "channel" ? "О чём канал" : "Описание (необязательно)";
      });
    });
    $("createMemberSearch").addEventListener("input", () => {
      clearTimeout(CreateChat.timer);
      CreateChat.timer = setTimeout(CreateChat.runSearch, 250);
    });
    $("btnCreateSubmit").addEventListener("click", CreateChat.submit);
  },

  open() {
    CreateChat.members.clear();
    $("createName").value = "";
    $("createDescription").value = "";
    $("createMemberSearch").value = "";
    $("createMemberResults").innerHTML = "";
    $("createStatus").textContent = "";
    CreateChat.renderChips();
    showModal("createModal");
  },

  async runSearch() {
    const query = $("createMemberSearch").value;
    const results = $("createMemberResults");
    results.innerHTML = "";
    if (!query.trim()) return;
    const users = await Search.users(query);
    for (const user of users) {
      if (CreateChat.members.has(user.id)) continue;
      const row = el("div", "search-result");
      const avatar = el("div", "avatar sm"); renderAvatarInto(avatar, user.avatar, user.avatar_color);
      const name = el("div", "search-result-name"); name.textContent = user.username;
      const btn = document.createElement("button"); btn.textContent = "Добавить";
      btn.addEventListener("click", () => {
        CreateChat.members.set(user.id, user.username);
        CreateChat.renderChips();
        results.innerHTML = "";
        $("createMemberSearch").value = "";
      });
      row.append(avatar, name, btn);
      results.appendChild(row);
    }
  },

  renderChips() {
    const wrap = $("createMemberChips");
    wrap.innerHTML = "";
    for (const [id, name] of CreateChat.members) {
      const chip = el("div", "chip");
      chip.innerHTML = `<span>${esc(name)}</span>`;
      const rm = document.createElement("button"); rm.textContent = "✕";
      rm.addEventListener("click", () => { CreateChat.members.delete(id); CreateChat.renderChips(); });
      chip.appendChild(rm);
      wrap.appendChild(chip);
    }
  },

  async submit() {
    const name = $("createName").value.trim();
    const status = $("createStatus");
    if (!name) { status.textContent = "Введи название"; return; }
    status.textContent = "Создаём...";
    try {
      const chatId = await Chats.create(CreateChat.type, name, $("createDescription").value.trim(), [...CreateChat.members.keys()]);
      await Chats.loadAll();
      await Chats.select(chatId);
      hideModal("createModal");
    } catch (err) {
      status.textContent = err.message || "Ошибка создания";
    }
  }
};

/* ============================================================================
   ADD MEMBER MODAL
   ============================================================================ */
const AddMemberModal = {
  timer: null,
  init() {
    $("btnAddMember").addEventListener("click", () => { showModal("addMemberModal"); $("addMemberSearch").value = ""; $("addMemberResults").innerHTML = ""; });
    $("addMemberSearch").addEventListener("input", () => {
      clearTimeout(AddMemberModal.timer);
      AddMemberModal.timer = setTimeout(AddMemberModal.run, 250);
    });
  },
  async run() {
    const query = $("addMemberSearch").value;
    const results = $("addMemberResults");
    results.innerHTML = "";
    if (!query.trim()) return;
    const users = await Search.users(query);
    for (const user of users) {
      const row = el("div", "search-result");
      const avatar = el("div", "avatar sm"); renderAvatarInto(avatar, user.avatar, user.avatar_color);
      const name = el("div", "search-result-name"); name.textContent = user.username;
      const btn = document.createElement("button"); btn.textContent = "Добавить";
      btn.addEventListener("click", async () => {
        btn.disabled = true; btn.textContent = "...";
        await Chats.addMember(State.currentChatId, user.id);
        hideModal("addMemberModal");
      });
      row.append(avatar, name, btn);
      results.appendChild(row);
    }
  }
};

/* ============================================================================
   APP BOOTSTRAP
   ============================================================================ */
const App = {
  async start(user) {
    State.userId = user.id;
    State.profile = await Profiles.ensure(user.id);
    $("authScreen").hidden = true;
    $("appShell").hidden = false;
    await Chats.loadAll();
  },

  stop() {
    State.userId = null;
    State.profile = null;
    State.chats.clear();
    State.messagesByChat = {};
    State.currentChatId = null;
    if (State.realtimeChannel) { supabase.removeChannel(State.realtimeChannel); State.realtimeChannel = null; }
    $("appShell").hidden = true;
    $("authScreen").hidden = false;
  },

  initComposer() {
    $("btnSend").addEventListener("click", Messages.send);
    $("messageInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); Messages.send(); }
    });
  },

  init() {
    Auth.init();
    ProfileModal.init();
    SearchModal.init();
    CreateChat.init();
    AddMemberModal.init();
    App.initComposer();

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
  }
};

App.init();
</script>
